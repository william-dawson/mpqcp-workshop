# -----------------------------------------------------------------------------
# Program. While this is TBA the page shows a short placeholder instead of a
# table; it becomes a schedule as soon as a list of days is put here.
# -----------------------------------------------------------------------------
program: TBA

# When the schedule firms up, replace the TBA above with a list of days:
#
# program:
#   - day: {en: "January 19th", ja: "1月19日"}
#     slots:
#       - {time: "09:00 - 09:40", kind: registration}
#       - time: "10:00 - 10:30"
#         speaker: {en: Taro Yamada, ja: 山田太郎}
#         affiliation: {en: University of Tokyo, ja: 東京大学}
#         title: A scalable algorithm for something interesting
#       - {time: "13:00 - 13:45", kind: tba, keynote: true}
#       - {time: "11:45 - 13:00", kind: lunch}
#
# `kind` is one of the labels in data/strings.yml -> session_kinds
# (registration, welcome, lunch, break, poster, discussion, tba); it is
# translated automatically, so those rows need no per-language text.

