# =============================================================================
# MPQCP workshop data -- the single source of truth for the whole site.
#
# HOW TO EDIT
#   * Any value may be either a plain string (shared by every language) or a
#     mapping of language code -> string (e.g. {en: "Free", ja: "無料"}).
#     Use a plain string whenever the text is the same in both languages
#     (URLs, times, names written in Latin script, English talk titles...).
#   * Values may contain HTML; it is rendered as-is.
#   * Keep Japanese text on a single line: YAML folded blocks (>-) join lines
#     with a space, which is wrong for Japanese.
#   * Anything still set to `TBA` shows up on the page as a highlighted
#     placeholder, so unfinished items are easy to spot.
#
# See AGENTS.md for the yearly update checklist.
# =============================================================================

edition: 8            # 8th workshop in the series
year: 2027
acronym: MPQCP 2027

name:
  en: International Workshop on Massively Parallel Programming for Quantum Chemistry and Physics
  ja: International Workshop on Massively Parallel Programming for Quantum Chemistry and Physics

description:
  en: Information about the International Workshop on Massively Parallel Programming for Quantum Chemistry and Physics, to be held in Japan in 2027.
  ja: 2027年に日本で開催されるInternational Workshop on Massively Parallel Programming for Quantum Chemistry and Physicsワークショップに関する情報。

keywords:
  en: Quantum Chemistry, Workshop, Parallel Programming, Supercomputer, MPQCP 2027
  ja: 量子化学、ワークショップ、並列プログラミング、スーパーコンピュータ、MPQCP 2027

