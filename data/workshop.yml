# -----------------------------------------------------------------------------
# Program. One block per day; each block has a heading and a list of slots.
#
# A slot is:  time, then either
#   kind:    one of the shared labels defined in strings.yml (registration,
#            welcome, lunch, break, poster, discussion, tba) -- no per-slot
#            text needed, it is translated automatically; or
#   speaker: name (per-language if written in kanji), affiliation, title.
# Set `keynote: true` to mark a slot as a keynote.
# -----------------------------------------------------------------------------
program:
  - day: TBA
    slots:
      - {time: TBA, kind: registration}
      - {time: TBA, kind: welcome}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: lunch}
      - {time: TBA, kind: tba, keynote: true}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: break}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: poster}

  - day: TBA
    slots:
      - {time: TBA, kind: registration}
      - {time: TBA, kind: welcome}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: break}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: lunch}
      - {time: TBA, kind: tba, keynote: true}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: break}
      - {time: TBA, kind: tba}
      - {time: TBA, kind: discussion}

